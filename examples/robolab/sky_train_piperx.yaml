# SkyPilot job: full pi05 fine-tune on RoboLab Piper X data (config pi05_piperx).
# Launch from the submitter box:
#   sky launch -c pi05-piperx examples/robolab/sky_train_piperx.yaml -i 15 --down --env EXP_NAME=piperx_v1
# Always pass `-i 15 --down`: a plain stop still bills the AMI's 2 TB root volume.
# Before launching: put the converted LeRobot v2.1 dataset under DATASET_SRC (EFS or S3) and set REPO_ID to match.

name: pi05-piperx

resources:
  cloud: aws
  # NOTE: g6e.xlarge (32 GiB RAM) OOMs at the first orbax checkpoint save (~17 GB train_state staged through
  # host memory). Use g6e.2xlarge (64 GiB) or larger for pi05 saves.
  # AWS has no single-GPU A100-80GB (p4de is 8x only). Single H100 = p5.4xlarge, us-west-2 only, ~$6.9/h;
  # full fine-tune needs >70 GB. For the LoRA configs use L40S:1 (g6e.2xlarge, us-east-2). :8 for FSDP/batch 256.
  accelerators: L40S:1        # must stay consistent with any --instance-type override (g6e.* = L40S)
  disk_size: 512
  use_spot: false

envs:
  EXP_NAME: piperx_v1
  CONFIG: pi05_piperx
  REPO_ID: trc/robolab_piperx
  DATASET_SRC: s3://robotics-data-exports/datasets/lerobot_v21/trc/robolab_piperx   # or an EFS path if mounted
  HF_LEROBOT_HOME: /home/ubuntu/lerobot_v21
  WANDB_PROJECT: robolab-pi05-train
  TRAIN_EXTRA_ARGS: ""          # e.g. "--num-train-steps 12 --save-interval 10" to prove the save path
  MEM_FRACTION: "0.75"           # device fraction; 0.9 left no headroom for orbax's save-time d2h copies
  WANDB_API_KEY:                 # required: pass --env WANDB_API_KEY=... at launch (from ~/.netrc)

file_mounts:
  # openpi-train with our RoboLab configs; norm stats live in assets/<CONFIG>/ inside the repo.
  ~/openpi-train: ~/git/trc-policy-lab/openpi
  # W&B login (api.wandb.ai entry); openpi calls wandb.init at train start.
  ~/.netrc: ~/.netrc

setup: |
  set -e
  cd ~/openpi-train
  curl -LsSf https://astral.sh/uv/install.sh | sh; export PATH=$HOME/.local/bin:$PATH
  command -v aws >/dev/null || uv tool install awscli >/dev/null   # stock sky image has no aws CLI; creds are synced by sky
  GIT_LFS_SKIP_SMUDGE=1 uv sync
  # Pre-warm the base checkpoint in the background while the dataset syncs (cold EBS reads are slow).
  mkdir -p ~/.cache/openpi/openpi-assets/checkpoints
  (uv run python -c "import openpi.shared.download as d; d.maybe_download('gs://openpi-assets/checkpoints/pi05_base/params')" &)
  mkdir -p $HF_LEROBOT_HOME/$(dirname $REPO_ID)
  case "$DATASET_SRC" in
    s3://*) aws s3 sync "$DATASET_SRC" "$HF_LEROBOT_HOME/$REPO_ID" ;;
    *)      rsync -a "$DATASET_SRC/" "$HF_LEROBOT_HOME/$REPO_ID/" ;;
  esac
  wait

run: |
  set -e
  cd ~/openpi-train
  export PATH=$HOME/.local/bin:$PATH
  command -v aws >/dev/null || uv tool install awscli >/dev/null
  # Dataset must match CONFIG's repo_id; fetch if the setup step ran with a different REPO_ID (e.g. after `sky exec`).
  if [ ! -f "$HF_LEROBOT_HOME/$REPO_ID/meta/info.json" ]; then
    mkdir -p "$HF_LEROBOT_HOME/$(dirname $REPO_ID)"
    case "$DATASET_SRC" in
      s3://*) aws s3 sync --quiet "$DATASET_SRC" "$HF_LEROBOT_HOME/$REPO_ID" ;;
      *)      rsync -a "$DATASET_SRC/" "$HF_LEROBOT_HOME/$REPO_ID/" ;;
    esac
  fi
  test -f "$HF_LEROBOT_HOME/$REPO_ID/meta/info.json" || { echo "dataset $REPO_ID missing at $HF_LEROBOT_HOME"; exit 2; }
  # Push every saved checkpoint to S3 while training runs (the submitter box evaluates them as they land).
  # The loop is killed on ANY exit (trap), so a crashed train.py cannot leave the job RUNNING and the cluster billing.
  CKPT_S3=s3://robotics-data-exports/checkpoints/openpi/$CONFIG/$EXP_NAME
  ( while true; do aws s3 sync --quiet --exclude '*.partial*' checkpoints/$CONFIG/$EXP_NAME $CKPT_S3 2>/dev/null || true; sleep 120; done ) &
  SYNC_PID=$!
  trap 'kill $SYNC_PID 2>/dev/null || true' EXIT
  XLA_PYTHON_CLIENT_MEM_FRACTION=$MEM_FRACTION uv run scripts/train.py $CONFIG --exp-name=$EXP_NAME --project-name=$WANDB_PROJECT --overwrite $TRAIN_EXTRA_ARGS
  kill $SYNC_PID 2>/dev/null || true
  # Checkpoints: ~/openpi-train/checkpoints/$CONFIG/$EXP_NAME/<step>/ ; final sync + done marker.
  aws s3 sync checkpoints/$CONFIG/$EXP_NAME $CKPT_S3 && touch /tmp/done && aws s3 cp /tmp/done $CKPT_S3/TRAINING_DONE
